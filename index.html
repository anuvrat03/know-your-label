<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Label & Barcode Health Analyzer</title>
  <!-- Tailwind CSS for visual styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ZXing Library for Barcode Detection -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6 min-h-screen">

  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Label & Ingredient Health Analyzer</h1>
    <p class="text-slate-600 text-sm mb-6">Upload an image of a barcode or label, or type ingredients manually to get product and health role insights.</p>

    <!-- Gemini API Key Input -->
    <div class="mb-4 bg-amber-50 p-4 rounded-lg border border-amber-200">
      <label class="block text-xs font-semibold text-amber-900 uppercase tracking-wider mb-1">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your free Google AI Studio API key here" 
             class="w-full text-sm p-2 border border-amber-300 rounded focus:ring-2 focus:ring-amber-500 outline-none">
      <p class="text-xs text-amber-700 mt-1">Get a free key from <a href="https://aistudio.google.com/" target="_blank" class="underline">Google AI Studio</a>.</p>
    </div>

    <!-- Upload / Manual Input Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="border-2 border-dashed border-slate-300 rounded-lg p-4 text-center bg-slate-50">
        <label class="block text-sm font-medium text-slate-700 mb-2">Upload Barcode / Label Image</label>
        <input type="file" id="imageInput" accept="image/*" class="block w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Or Paste Ingredients Manually</label>
        <textarea id="manualIngredients" rows="3" placeholder="e.g. Water, Sugar, Citric Acid, Xanthan Gum..." 
                  class="w-full text-sm p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>
    </div>

    <button onclick="processInput()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow transition-colors">
      Analyze Product & Ingredients
    </button>

    <!-- Status Messages -->
    <div id="status" class="mt-4 text-sm font-medium text-slate-600 hidden"></div>

    <!-- Results Display -->
    <div id="results" class="mt-6 hidden">
      <h2 id="productTitle" class="text-lg font-bold text-indigo-950 mb-2"></h2>
      <div id="aiOutput" class="prose max-w-none text-slate-700 text-sm bg-slate-50 p-4 rounded-lg border border-slate-200"></div>
    </div>
  </div>

  <script>
    async function processInput() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const fileInput = document.getElementById('imageInput');
      const manualText = document.getElementById('manualIngredients').value.trim();
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      const productTitle = document.getElementById('productTitle');
      const aiOutput = document.getElementById('aiOutput');

      if (!apiKey) {
        alert("Please enter your Gemini API key.");
        return;
      }

      status.classList.remove('hidden');
      results.classList.add('hidden');
      status.innerText = "Processing...";

      let ingredientsText = manualText;
      let productName = "Custom Product Scan";

      // 1. Check if user uploaded an image to read a barcode
      if (fileInput.files.length > 0 && !manualText) {
        status.innerText = "Scanning image for barcode...";
        try {
          const barcode = await scanBarcodeFromImage(fileInput.files[0]);
          if (barcode) {
            status.innerText = `Found Barcode (${barcode}). Fetching from Open Food Facts...`;
            const offData = await fetchOpenFoodFacts(barcode);
            if (offData && offData.product) {
              productName = offData.product.product_name || "Unknown Product";
              ingredientsText = offData.product.ingredients_text || "";
            }
          }
        } catch (err) {
          console.warn("Barcode scanning attempt finished:", err);
        }
      }

      if (!ingredientsText) {
        status.innerText = "Could not find ingredient text automatically. Please paste ingredients in the box.";
        return;
      }

      // 2. Call Gemini API to analyze the ingredients
      status.innerText = "Analyzing ingredient roles and health impact via Gemini AI...";
      try {
        const analysis = await analyzeIngredientsWithGemini(ingredientsText, apiKey);
        productTitle.innerText = productName;
        aiOutput.innerHTML = analysis;
        results.classList.remove('hidden');
        status.classList.add('hidden');
      } catch (err) {
        status.innerText = "Error analyzing with Gemini AI: " + err.message;
      }
    }

    // ZXing Barcode Scanning
    function scanBarcodeFromImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const codeReader = new ZXing.BrowserMultiFormatReader();
            codeReader.decodeFromImageElement(img)
              .then(result => resolve(result.text))
              .catch(err => reject(err));
          };
        };
        reader.readAsDataURL(file);
      });
    }

    // Open Food Facts API Fetch
    async function fetchOpenFoodFacts(barcode) {
      const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
      if (!response.ok) return null;
      return await response.json();
    }

    // Gemini API Request
    async function analyzeIngredientsWithGemini(ingredients, apiKey) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const prompt = `
        Analyze the following product ingredients: "${ingredients}".
        Provide a structured HTML summary (using simple <table>, <b>, or bullet points without full html wrapper tags).
        For each ingredient, list:
        1. Ingredient Name
        2. Technical/Functional Role in Product (e.g., Emulsifier, Preservative, Flavor)
        3. Impact on Human Health & Considerations (e.g., benefits, allergen risks, safe daily consumption notes)
      `;

      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts[0].text;
    }
  </script>
</body>
</html>
